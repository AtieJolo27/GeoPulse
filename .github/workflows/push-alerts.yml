name: Push alerts

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-alerts
  cancel-in-progress: false

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-push.txt
      - name: Install push worker dependencies
        run: python -m pip install -r requirements-push.txt
      - name: Send due reminders and soil alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          for name in ('SUPABASE_URL', 'SUPABASE_KEY'):
              if not os.environ.get(name):
                  raise SystemExit(f'Missing required GitHub Actions secret for {name}')
          PY
          python -m app.services.push_worker
